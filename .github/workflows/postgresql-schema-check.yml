---
name: PostgreSQL Schema Check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "schema.sql"
  merge_group:
  push:
    paths:
      - "schema.sql"
    branches:
      - main

jobs:
  postgresql-schema-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canary
          POSTGRES_USER: canary
          POSTGRES_PASSWORD: canary
        ports:
          - 5432/tcp
        options: --health-cmd="pg_isready -U canary -d canary" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
    name: Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
      - name: Import Canary Schema
        env:
          PGPASSWORD: canary
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U canary -d canary -v ON_ERROR_STOP=1 -f schema.sql
